[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflmeta"
version = "0.1.5"
description = "Official Python SDK for the NFLMeta API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "NFLMeta" }
]
keywords = ["nfl", "nflmeta", "sports", "api", "sdk", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nflmeta = ["py.typed"]

[project.urls]
Homepage = "https://nflmeta.org/api-docs/sdk"
Documentation = "https://nflmeta.org/api-docs"
Source = "https://github.com/philippebourdon/NFLMeta"
